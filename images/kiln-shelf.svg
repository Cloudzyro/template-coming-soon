<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 720" role="img" aria-labelledby="t">
  <title id="t">Three stoneware pieces on a kiln shelf: a tall celadon vase, a tenmoku bowl with a rust rim and a white shino mug, with a strip of glaze test tiles in front</title>
  <defs>
    <linearGradient id="celadon" x1="0" x2="1">
      <stop offset="0" stop-color="#7fa597"/><stop offset=".45" stop-color="#a9c8bb"/><stop offset="1" stop-color="#6f9486"/>
    </linearGradient>
    <linearGradient id="tenmoku" x1="0" x2="1">
      <stop offset="0" stop-color="#2a1a14"/><stop offset=".5" stop-color="#4a2d20"/><stop offset="1" stop-color="#22150f"/>
    </linearGradient>
    <linearGradient id="shino" x1="0" x2="1">
      <stop offset="0" stop-color="#e2d6c6"/><stop offset=".5" stop-color="#f4ece1"/><stop offset="1" stop-color="#d6c8b4"/>
    </linearGradient>
    <linearGradient id="clay" x1="0" x2="1">
      <stop offset="0" stop-color="#9c6b4a"/><stop offset=".5" stop-color="#b98560"/><stop offset="1" stop-color="#8a5c3e"/>
    </linearGradient>
    <linearGradient id="wall" y1="0" y2="1">
      <stop offset="0" stop-color="#3b302a"/><stop offset="1" stop-color="#2c241f"/>
    </linearGradient>
    <clipPath id="frame"><rect width="640" height="720" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="640" height="720" fill="url(#wall)"/>
    <!-- soft brick courses of the kiln wall -->
    <g stroke="#463a33" stroke-width="2" opacity=".7">
      <path d="M0 90H640M0 180H640M0 270H640M0 360H640"/>
      <path d="M120 0V90M300 0V90M480 0V90M40 90V180M210 90V180M390 90V180M570 90V180M120 180V270M300 180V270M480 180V270M40 270V360M210 270V360M390 270V360M570 270V360"/>
    </g>

    <!-- kiln shelf and posts -->
    <rect x="40" y="470" width="560" height="26" rx="3" fill="#cdbfae"/>
    <rect x="40" y="494" width="560" height="8" fill="#a8998a"/>
    <rect x="80" y="502" width="34" height="218" fill="#b4a493"/>
    <rect x="526" y="502" width="34" height="218" fill="#b4a493"/>
    <rect x="40" y="604" width="560" height="20" rx="3" fill="#cdbfae"/>
    <rect x="40" y="622" width="560" height="6" fill="#a8998a"/>

    <!-- celadon vase -->
    <ellipse cx="190" cy="470" rx="70" ry="6" fill="#1a1411" opacity=".45"/>
    <path d="M160 160 H220 V196 C220 214 262 248 262 330 C262 410 236 452 232 470 H148 C144 452 118 410 118 330 C118 248 160 214 160 196 Z" fill="url(#celadon)"/>
    <ellipse cx="190" cy="160" rx="30" ry="6" fill="#56786c"/>
    <!-- pooled glaze at the foot shows the clay -->
    <path d="M148 470 C146 460 144 452 142 446 C160 452 176 440 190 448 C206 456 222 444 238 446 C236 452 234 460 232 470 Z" fill="url(#clay)"/>
    <path d="M140 300 C150 296 158 304 168 300" stroke="#c9e0d6" stroke-width="3" fill="none" opacity=".6"/>

    <!-- tenmoku bowl -->
    <ellipse cx="380" cy="470" rx="80" ry="6" fill="#1a1411" opacity=".45"/>
    <path d="M300 372 H460 C460 420 432 458 400 464 L396 470 H364 L360 464 C328 458 300 420 300 372 Z" fill="url(#tenmoku)"/>
    <path d="M300 372 H460 C460 384 458 392 456 398 C440 392 424 402 408 396 C392 390 372 402 356 396 C340 390 318 400 304 396 C302 390 300 382 300 372 Z" fill="#a4512b"/>
    <ellipse cx="380" cy="372" rx="80" ry="10" fill="#1b110d"/>
    <path d="M308 372 C330 380 430 380 452 372" stroke="#c46a3a" stroke-width="2" fill="none" opacity=".8"/>

    <!-- shino mug -->
    <ellipse cx="530" cy="470" rx="46" ry="5" fill="#1a1411" opacity=".45"/>
    <path d="M490 380 H570 V458 C570 466 564 470 556 470 H504 C496 470 490 466 490 458 Z" fill="url(#shino)"/>
    <path d="M570 398 C598 398 600 446 570 446" stroke="#e8ddcf" stroke-width="10" fill="none"/>
    <ellipse cx="530" cy="380" rx="40" ry="5" fill="#cbbca8"/>
    <g fill="#d48a5a" opacity=".55"><circle cx="506" cy="420" r="5"/><circle cx="548" cy="440" r="7"/><circle cx="526" cy="404" r="3"/></g>

    <!-- glaze test tiles -->
    <g transform="translate(130 560)">
      <rect width="380" height="44" rx="4" fill="#d9cbb8"/>
      <rect x="8" y="6" width="56" height="32" rx="3" fill="#94b5a8"/>
      <rect x="70" y="6" width="56" height="32" rx="3" fill="#3a241a"/>
      <rect x="132" y="6" width="56" height="32" rx="3" fill="#efe6da"/>
      <rect x="194" y="6" width="56" height="32" rx="3" fill="#a4512b"/>
      <rect x="256" y="6" width="56" height="32" rx="3" fill="#5f7f9c"/>
      <rect x="318" y="6" width="54" height="32" rx="3" fill="#c9a24a"/>
    </g>
  </g>
</svg>
